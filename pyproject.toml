[project]
name = "stylematch-feasibility"
version = "0.1.0"
description = "STYLEMATCH-001A experiment contracts and deterministic evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_cache/tmp"
