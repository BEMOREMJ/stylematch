<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>Private description factuality review</title>
<style>body{font:18px system-ui;margin:24px;background:#f5f4f0;color:#202b2a}main{max-width:1000px;margin:auto}img{height:55vh;width:100%;object-fit:contain}button,select,textarea{font:inherit;padding:10px;margin:8px}label{display:block}textarea{width:80%}</style>
<main><h1>Description factuality review</h1><p>Your attribute reference was preserved before this review. Check each description against visible pixels. Flag guessed material, brand, fit, construction, colors, patterns or concealed features. A missing description is a model failure.</p><p id="context"></p><p id="progress"></p><p id="source"></p><img id="photo" alt="Garment view"><p id="description"></p>
<label>Does the description assert any unsupported detail?<select id="decision"><option value="">Choose</option><option value="false">No unsupported detail found</option><option value="true">Yes, unsupported detail</option><option value="unknown">Cannot decide</option><option value="missing">No valid description</option></select></label>
<label>Unsupported details or uncertainty notes<textarea id="notes"></textarea></label>
<button id="prev">Previous</button><button id="next">Next</button><button id="save">Save review</button><label>Resume saved review<input id="resume" type="file" accept=".json"></label><p id="status"></p></main>
<script>
const D=/*PAYLOAD*/null;let index=0,rows=D.items.map(x=>({id:x.id,unsupported:'',notes:''}));const $=id=>document.getElementById(id);
function render(){const item=D.items[index];$('context').textContent=D.context||'';$('source').textContent=item.source_note||'';$('progress').textContent=`${index+1} / ${D.items.length} · ${item.id}${item.occluded?' · retained occluded component':''}`;$('photo').src=item.pixels;$('description').textContent=item.description||'[No valid description]';$('decision').value=rows[index].unsupported;$('notes').value=rows[index].notes;$('prev').disabled=index===0;$('next').disabled=index===rows.length-1;}
$('decision').onchange=()=>rows[index].unsupported=$('decision').value;$('notes').oninput=()=>rows[index].notes=$('notes').value;$('prev').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};
$('save').onclick=()=>{const complete=rows.every(r=>['true','false','unknown','missing'].includes(r.unsupported)&&(!['true','unknown'].includes(r.unsupported)||r.notes.trim()));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({binding:D.binding,completed_by:complete?'Mark':null,items:rows},null,2)],{type:'application/json'}));a.download='001d-description-checks.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent=complete?'Completed review saved; send Codex its local path.':'Progress saved. All decisions and notes for unsupported/uncertain cases are required.';};
$('resume').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.binding!==D.binding||d.items.length!==rows.length||d.items.some((r,i)=>r.id!==rows[i].id))throw Error('Different review binding');rows=d.items;render();}catch(e){$('status').textContent=e.message;}};window.addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue='Save review first'});render();
</script></html>
